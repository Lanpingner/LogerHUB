# LogerHub — reverse proxy for a host nginx that terminates TLS.
#
# Put this in /etc/nginx/sites-available/ (or conf.d/) and point it at the
# compose stack, which publishes only to 127.0.0.1:
#
#     web    (console)  127.0.0.1:3000
#     ingest (gateway)  127.0.0.1:8080
#
# Two things here are not optional:
#
#   * /v1/stream is a long-lived WebSocket. Without the Upgrade headers and a
#     long read timeout, nginx closes it every 60 seconds and your services
#     reconnect in a loop.
#   * /api/live is server-sent events. With nginx's default buffering on, the
#     live tail shows nothing until the buffer fills — it looks broken.

# Only these two values travel to the WebSocket upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream logerhub_console {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream logerhub_gateway {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name logs.example.com;

    # Let your ACME client answer here, then send everything else to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logs.example.com;

    ssl_certificate     /etc/letsencrypt/live/logs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batches are capped at 1 MB by the gateway; give nginx a little headroom
    # so an oversized batch is refused by the gateway with a clear error
    # rather than by nginx with a bare 413.
    client_max_body_size 2m;

    access_log /var/log/nginx/logerhub.access.log;
    error_log  /var/log/nginx/logerhub.error.log;

    # ---- ingest: the persistent stream your services connect to -------------
    location = /v1/stream {
        proxy_pass http://logerhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The gateway pings every 30s; this only has to outlast that.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---- ingest: HTTP fallback and health ----------------------------------
    location = /v1/logs {
        proxy_pass http://logerhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://logerhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---- the gateway's internal endpoints are never public -----------------
    # The console reaches these over the compose network, not through nginx.
    location /internal/ {
        return 404;
    }

    # ---- console: live tail is server-sent events --------------------------
    location = /api/live {
        proxy_pass http://logerhub_console;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Without these three the stream is buffered and the tail looks dead.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ---- console: everything else ------------------------------------------
    location / {
        proxy_pass http://logerhub_console;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Next.js fingerprints these, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://logerhub_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
