# Single-binary Loki, TSDB + v13 schema, structured metadata on.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true

  # Ingestion ceilings. The gateway is the only writer and already caps batch
  # size, but a compromised key must not be able to fill the disk: Loki is the
  # last line, and these are the limits it enforces itself.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 4MB
  per_stream_rate_limit_burst: 16MB

  # Stream count is the resource that actually hurts when it runs away, because
  # every stream is its own chunk. Our labels are service/env/level only, so a
  # few dozen is the honest number; 500 leaves room without leaving the door open.
  max_global_streams_per_user: 500
  max_label_names_per_series: 15
  max_label_name_length: 64
  max_label_value_length: 256

  # The gateway clamps timestamps, so anything arriving outside this window is a
  # bug or an attack rather than a slow client.
  creation_grace_period: 10m

  # Query-side caps, so one careless console query cannot take Loki down.
  max_entries_limit_per_query: 10000
  max_query_length: 721h
  max_query_series: 1000

  # Must stay in step with the client spool's maxAge (7 days). A longer outage
  # than this replays into rejection, which would silently waste the spool.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Oversized lines are DISCARDED by default rather than cut short, so turn
  # truncation on as a backstop. The client truncates bodies first, at a
  # structural boundary, because server-side truncation breaks JSON parsing.
  max_line_size: 256KB
  max_line_size_truncate: true
  max_line_size_truncate_identifier: '…[truncated by loki]'

  # Errors carry the bodies worth keeping; routine traffic ages out sooner.
  retention_period: 720h
  retention_stream:
    - selector: '{level="error"}'
      period: 2160h
    - selector: '{level="fatal"}'
      period: 2160h
    - selector: '{level=~"debug|info"}'
      period: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
